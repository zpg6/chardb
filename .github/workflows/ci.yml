name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build exact candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and pack candidate once
        shell: bash
        run: |
          bun run build:react
          mkdir .ci-pack
          core_tarball="$(npm pack --ignore-scripts --pack-destination .ci-pack)"
          react_tarball="$(npm pack --ignore-scripts --pack-destination .ci-pack ./packages/react)"
          bun scripts/ci-candidate-artifact.mjs --stage ".ci-pack/${core_tarball}" --react ".ci-pack/${react_tarball}" --directory ci-candidate

      - name: Upload exact candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-candidate
          if-no-files-found: error

  generated-macos:
    name: Generated macOS app
    needs: candidate
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-candidate

      - name: Verify exact candidate handoff
        run: bun scripts/ci-candidate-artifact.mjs --verify --directory ci-candidate

      - name: Exercise generated app
        shell: bash
        env:
          CDB_GENERATED_E2E_PLATFORM_NAME: macos-latest
        run: |
          bun scripts/smoke-packed-package.mjs ci-candidate/core.tgz
          bun scripts/smoke-generated-project.mjs ci-candidate/core.tgz --react ci-candidate/react.tgz

  generated-windows-dev-tree:
    name: Generated Windows dev tree
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-candidate

      - name: Verify exact candidate handoff
        run: bun scripts/ci-candidate-artifact.mjs --verify --directory ci-candidate

      - name: Exercise generated dev shutdown
        shell: pwsh
        run: |
          bun test/windows-dev-tree.mjs --tarball ci-candidate/core.tgz --react-tarball ci-candidate/react.tgz

  verify:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Set up Node for npm consumer smoke tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.1

      - name: Pin npm for consumer smoke tests
        shell: bash
        run: |
          npm install --global npm@11.6.0
          node --version
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-candidate

      - name: Verify exact candidate handoff
        run: bun scripts/ci-candidate-artifact.mjs --verify --directory ci-candidate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Scan Git history for high-confidence secrets
        run: bun run security:history

      - name: Test correctness suite
        run: bun run test:correctness

      - name: Build landing page
        run: bun run --cwd landing build

      - name: Smoke-test exact candidate
        shell: bash
        env:
          CDB_GENERATED_E2E_PLATFORM_NAME: ubuntu-latest
        run: |
          bun scripts/smoke-packed-package.mjs ci-candidate/core.tgz
          bun scripts/smoke-packed-react.mjs ci-candidate/core.tgz ci-candidate/react.tgz
          bun scripts/smoke-packed-org-user.mjs ci-candidate/core.tgz
          bun scripts/smoke-packed-public-vector.mjs ci-candidate/core.tgz --react ci-candidate/react.tgz
          bun scripts/smoke-packed-browser.mjs ci-candidate/core.tgz --react ci-candidate/react.tgz
          bun scripts/smoke-generated-project.mjs ci-candidate/core.tgz --react ci-candidate/react.tgz
          bun scripts/smoke-packed-chat.mjs ci-candidate/core.tgz --react ci-candidate/react.tgz
