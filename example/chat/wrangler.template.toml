# Worker name and entry. The default export of src/server/worker.ts is the
# mounted fetch handler. Its exported Durable Object classes live beside it.
name = "chardb-chat-example"
main = "src/server/worker.ts"
compatibility_date = "2026-05-10"
compatibility_flags = ["nodejs_compat"]

[vars]
CHAT_SCHEMA_HISTORY = "better-auth-1.7"

# These migrations provision the exported classes. The explicit same-Worker
# namespaces let the Worker and Durable Objects call each other in every
# Wrangler and Miniflare execution context.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Cdb", "Catalog", "Gateway", "Resharder"]

[[durable_objects.bindings]]
name = "CDB_CATALOG"
class_name = "Catalog"

[[durable_objects.bindings]]
name = "CDB_SHARD"
class_name = "Cdb"

[[durable_objects.bindings]]
name = "CDB_GATEWAY"
class_name = "Gateway"

[[durable_objects.bindings]]
name = "CDB_RESHARD"
class_name = "Resharder"

# Static assets. The live CharDB routes run through the Worker first.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws", "/_chardb/*", "/api/*", "/health"]
